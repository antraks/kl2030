<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Competition venues — Kuala Lumpur 2030 (fictional site)</title>
  <meta name="description" content="The 16 competition venues of the Kuala Lumpur 2030 Commonwealth Games (fictional site): map, access and sports.">
  <link rel="icon" href="assets/embleme.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Hanken+Grotesk:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="sites">
  <header class="entete" id="entete"></header>

  <main>
    <section class="page-tete">
      <div class="conteneur">
        <h1>The venues</h1>
        <p id="intro-sites">Sixteen venues, from the Bukit Jalil National Stadium to the Nilai velodrome. All can be reached by public transport, and shuttles are free for ticket holders.</p>
      </div>
    </section>
    <div class="bande-rebung" aria-hidden="true"></div>

    <div class="conteneur">
      <div class="filtres">
        <fieldset>
          <legend>Hub</legend>
          <div id="filtre-poles" style="display:flex;flex-wrap:wrap;gap:8px"></div>
        </fieldset>
        <div class="filtres-bloc">
          <label for="filtre-sport">Sport
            <select id="filtre-sport"><option value="">All sports</option></select>
          </label>
        </div>
        <p class="resultat" id="resultat" aria-live="polite"></p>
      </div>

      <div class="sites-corps">
        <ul class="liste-sites" id="liste-sites"></ul>
        <div class="carte-cadre">
          <div id="carte" role="region" aria-label="Map of the competition venues"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="pied" id="pied"></footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/sites-data.js"></script>
  <script src="assets/restauration-data.js"></script>
  <script src="assets/commun.js"></script>
  <script src="assets/sites.js"></script>
</body>
</html>
